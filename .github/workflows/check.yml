name: check

# On every push: offline parsing tests (pytest) are the hard gate. scrape-check fetches the
# real site, but dda.gov.in answers only from India, so it cannot run from a GitHub runner
# (US/EU IPs) -- it is kept non-blocking here and must be run from the box through the India
# proxy instead:  myproxy run scrape-check --project dda-pages --items 2
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt pytest "scrape-hub-client @ git+https://github.com/s1d-labs/runner@main#subdirectory=sdk"
      - name: Parsing tests (offline, hard gate)
        run: python -m pytest tests -q
      - name: seeds.json sanity
        run: python -c "import family; print('pages', len(family.PAGE_ITEMS), 'docs', len(family.DOC_ITEMS)); assert all(p['items'] is not None for p in family.PROJECTS)"
      - name: scrape-check (India-only; may not reach from GitHub)
        continue-on-error: true
        run: scrape-check --items 2 --timeout 60
      - uses: actions/upload-artifact@v6
        if: ${{ always() }}
        with:
          name: scrape-check
          path: .scrape-check/
          if-no-files-found: ignore
