name: watch

# Weekly change watch: puts this week's item into project dda-watch (seed_watch.py). The hub gives it to a pool
# worker with an India proxy, which reads the first page of every listing and stores new pages and files
# (watch.py). About 120-400 requests a week. Run it by hand from Actions -> watch -> Run workflow.
on:
  schedule:
    - cron: "30 2 * * 1"          # Mondays 02:30 UTC (08:00 IST)
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  actions: write          # the keep-alive step below

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q "scrape-hub-client @ git+https://github.com/s1d-labs/runner@main#subdirectory=sdk"
      - run: python seed_watch.py
        env:
          SCRAPE_HUB_URL: https://scrape.s1d.me
      - name: Keep the schedule alive
        # GitHub turns off a scheduled workflow after 60 days without commits. Enabling it again through the API
        # each week resets that timer. (A workflow that a person turns off does not run, so this never undoes that.)
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/watch.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
